name: Update apartment calendar
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # UTC 00:00 = 한국시간 09:00. 실행 지연 가능.
permissions:
  contents: read
concurrency:
  group: apartment-calendar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sh_alert: ${{ steps.calendar.outputs.sh_alert }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Install SH browser collector
        continue-on-error: true
        if: ${{ vars.ENABLE_SH == 'true' }}
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Collect official data and generate ICS
        id: calendar
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          ENABLE_LH: ${{ vars.ENABLE_LH }}
          ENABLE_SH: ${{ vars.ENABLE_SH }}
          PREVIOUS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python calendar_builder.py --output site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  sh-health-alert:
    name: SH update needs attention (calendar already deployed)
    needs: [build, deploy]
    if: ${{ needs.build.outputs.sh_alert == 'true' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify through GitHub Actions failure notifications
        run: |
          echo "::error::SH update failed. The calendar was deployed with fresh Applyhome/LH data and the last successful SH events. Check status.json and the SH collector log."
          exit 1
